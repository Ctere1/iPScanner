name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.3.1)'
        required: true
        default: '1.3.1'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Import Developer ID and notarization credentials
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE:?}" "${CERTIFICATE_PASSWORD:?}" "${NOTARY_KEY:?}" "${NOTARY_KEY_ID:?}" "${NOTARY_ISSUER:?}"
          : "${SPARKLE_KEY:?}"
          umask 077
          printf '%s' "$SPARKLE_KEY" > "$RUNNER_TEMP/sparkle.key"
          KEYCHAIN="$RUNNER_TEMP/ipscanner-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials ipscanner-release --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --keychain "$KEYCHAIN"
      - name: Build, test, sign and notarize
        env:
          INPUT_VERSION: ${{ inputs.version }}
          SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          NOTARY_PROFILE: ipscanner-release
          SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/sparkle.key
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          export NOTARY_KEYCHAIN="$RUNNER_TEMP/ipscanner-signing.keychain-db"
          ./scripts/build-dmg.sh "$VERSION"
      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iPScanner-signed
          path: |
            build/release-*/*.dmg
            build/release-*/*.sha256
            build/release-*/update-feed/appcast.xml
          if-no-files-found: error
      - name: Prepare draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: docs/release-notes-${{ env.RELEASE_VERSION }}.md
          files: |
            build/release-*/*.dmg
            build/release-*/*.sha256
      - name: Remove temporary credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ipscanner-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/sparkle.key"
