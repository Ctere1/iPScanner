<text x="50" y="134" fill="#fff" font-size="62" font-weight="700" letter-spacing="-2">iPScanner</text>
<text x="54" y="186" fill="#d3e4f6" font-size="27">Find devices. Inspect services. Keep a snapshot.</text>
<text x="54" y="226" fill="#9eb6cc" font-size="18">A compact tool for everyday network work on macOS.</text>
